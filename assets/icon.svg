<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Gerald the goose</title>
  <rect width="512" height="512" fill="#34407a"/>

  <!-- Sparkles: Gerald is an enchanted goose -->
  <g fill="#f5c84c">
    <path d="M110 118 L119 147 L148 156 L119 165 L110 194 L101 165 L72 156 L101 147 Z"/>
    <path d="M172 62 L177 78 L193 83 L177 88 L172 104 L167 88 L151 83 L167 78 Z"/>
  </g>

  <g transform="translate(256 512) scale(1.06) translate(-256 -512)">
    <!-- Body -->
    <ellipse cx="236" cy="478" rx="176" ry="112" fill="#ffffff"/>
    <!-- Folded wing, tip flicking up as a tail -->
    <path d="M264 462 C212 424 142 404 70 412 C112 466 190 496 258 492 C274 486 276 472 264 462 Z" fill="#dfe3ee"/>
    <path d="M124 432 C166 442 206 454 240 468" fill="none" stroke="#c8cede" stroke-width="7" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M296 440 C286 356 330 318 326 214" fill="none" stroke="#ffffff" stroke-width="84" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="330" cy="194" r="64" fill="#ffffff"/>

    <!-- Beak -->
    <path d="M378 164 Q432 170 448 198 Q430 222 376 220 Z" fill="#f28c28" stroke="#f28c28" stroke-width="10" stroke-linejoin="round"/>
    <path d="M384 198 Q414 200 440 202" fill="none" stroke="#c4620f" stroke-width="5" stroke-linecap="round"/>

    <!-- Eye and grumpy brow -->
    <circle cx="348" cy="180" r="12" fill="#1d1d2b"/>
    <circle cx="352" cy="176" r="4" fill="#ffffff"/>
    <path d="M320 150 L372 164" fill="none" stroke="#1d1d2b" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
